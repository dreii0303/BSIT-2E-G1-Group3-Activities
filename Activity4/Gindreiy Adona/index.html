<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Personal Data Sheet</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #f2f2f2;
        padding: 30px;
    }

    .container {
        background: #fff;
        max-width: 900px;
        margin: auto;
        border-radius: 6px;
        box-shadow: 0 0 10px rgba(0,0,0,0.15);
        overflow: hidden;
    }

    .header {
        background: #0047ff;
        color: white;
        padding: 15px;
        font-size: 20px;
        font-weight: bold;
    }

    .section {
        padding: 20px;
    }

    .section h3 {
        color: #0047ff;
        margin-bottom: 15px;
    }

    .row {
        display: flex;
        gap: 20px;
        margin-bottom: 15px;
    }

    .field {
        flex: 1;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
    }

    input, select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
    }

    .submit-btn {
        background: #0047ff;
        color: white;
        border: none;
        width: 100%;
        padding: 12px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 4px;
        margin-top: 10px;
    }

    .submit-btn:hover {
        background: #0036c9;
    }

    .output {
        margin-top: 30px;
        background: #e9f5e9;
        border-radius: 6px;
        overflow: hidden;
    }

    .output-header {
        background: #1c7c3e;
        color: white;
        padding: 12px;
        font-weight: bold;
    }

    .output-content {
        padding: 20px;
    }

    .output-content p {
        margin: 8px 0;
    }

    .bold {
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="container">
    <div class="header">Personal Data Sheet</div>

    <div class="section">
        <h3>Personal Information</h3>

        <div class="row">
            <div class="field">
                <label>Full Name</label>
                <input type="text" id="fullname">
            </div>
            <div class="field">
                <label>Date of Birth</label>
                <input type="date" id="dob">
            </div>
        </div>

        <div class="row">
            <div class="field">
                <label>Gender</label>
                <select id="gender">
                    <option>Male</option>
                    <option>Female</option>
                </select>
            </div>
            <div class="field">
                <label>Civil Status</label>
                <select id="status">
                    <option>Single</option>
                    <option>Married</option>
                </select>
            </div>
        </div>
    </div>

    <div class="section">
        <h3>Contact Information</h3>

        <div class="row">
            <div class="field">
                <label>Email Address</label>
                <input type="email" id="email">
            </div>
            <div class="field">
                <label>Mobile Number</label>
                <input type="text" id="mobile">
            </div>
        </div>

        <div class="field">
            <label>Complete Address</label>
            <input type="text" id="address">
        </div>

        <button class="submit-btn" onclick="submitData()">Submit Personal Data Sheet</button>
    </div>
</div>

<div class="container output" id="output" style="display:none;">
    <div class="output-header">Submitted Information</div>
    <div class="output-content" id="outputContent"></div>
</div>

<script>
  
function submitData() {
    const fullname = document.getElementById("fullname").value;
    const dob = document.getElementById("dob").value;
    const gender = document.getElementById("gender").value;
    const status = document.getElementById("status").value;
    const email = document.getElementById("email").value;
    const mobile = document.getElementById("mobile").value;
    const address = document.getElementById("address").value;

    document.getElementById("output").style.display = "block";

    document.getElementById("outputContent").innerHTML = `
        <p><span class="bold">Full Name:</span> ${fullname}</p>
        <p><span class="bold">Date of Birth:</span> ${dob}</p>
        <p><span class="bold">Gender:</span> ${gender}</p>
        <p><span class="bold">Status:</span> ${status}</p>
        <p><span class="bold">Email:</span> ${email}</p>
        <p><span class="bold">Mobile:</span> ${mobile}</p>
        <p><span class="bold">Address:</span> ${address}</p>
    `;
}
</script>

</body>
</html>
